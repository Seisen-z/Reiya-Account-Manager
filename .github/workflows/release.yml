name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true
      build_only:
        description: 'Build and verify the installer without publishing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "Use a stable version like 1.2.1." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Patch tauri.conf.json version
        shell: bash
        run: |
          python -c "
          import json, sys
          with open('src-tauri/tauri.conf.json', 'r') as f:
              conf = json.load(f)
          conf['version'] = sys.argv[1]
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(conf, f, indent=2)
          " "$VERSION"

      - name: Patch Cargo.toml version
        shell: bash
        run: |
          python -c "
          import sys
          v = sys.argv[1]
          with open('src-tauri/Cargo.toml', 'r') as f:
              lines = f.readlines()
          done = False
          for i, line in enumerate(lines):
              if not done and line.startswith('version = '):
                  lines[i] = f'version = \"{v}\"\n'
                  done = True
          with open('src-tauri/Cargo.toml', 'w') as f:
              f.writelines(lines)
          " "$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Find NSIS installer
        id: installer
        shell: bash
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -1)
          echo "path=$EXE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$EXE")" >> $GITHUB_OUTPUT

      - name: Sign installer for the in-app updater
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "UPDATE_SIGNING_KEY secret is not set; refusing to publish an unsigned release." >&2
            exit 1
          fi
          EXE="${{ steps.installer.outputs.path }}"
          DEST="ReiyaAccountManager-$VERSION-setup.exe"
          cp "$EXE" "$DEST"
          node scripts/sign-update.cjs "$DEST"
          node scripts/verify-update.cjs "$DEST"
          sha256sum "$DEST" > SHA256SUMS.txt

      - name: Publish signed Reiya release to Seisen Premium
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SEISEN_PREMIUM_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SEISEN_PREMIUM_RELEASE_TOKEN is required to publish to Seisen Premium." >&2
            exit 1
          fi
          DEST="ReiyaAccountManager-$VERSION-setup.exe"
          TAG="reiya-v$VERSION"

          gh release create "$TAG" "$DEST" "$DEST.sig" SHA256SUMS.txt \
            --repo Seisen-z/Seisen-Premium \
            --title "Reiya Account Manager v$VERSION" \
            --notes "Version $VERSION. Install this update from the Reiya tab on seisen.store." \
            --draft --latest=false
          gh release edit "$TAG" --repo Seisen-z/Seisen-Premium --draft=false --latest=false
